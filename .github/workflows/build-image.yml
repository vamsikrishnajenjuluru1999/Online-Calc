name: Build and Deploy Calculator

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Calculator-Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/online-calc:latest
            ghcr.io/${{ github.repository_owner }}/online-calc:${{ github.sha }}

      - name: Login to OpenShift
        run: |
          oc login "${{ secrets.OPENSHIFT_API }}" \
            --token="${{ secrets.OPENSHIFT_TOKEN }}" \
            --insecure-skip-tls-verify=true

      - name: Deploy Calculator
        run: |
          oc project openshiftdemo
          oc set image deployment/online-calc \
            online-calc=ghcr.io/${{ github.repository_owner }}/online-calc:${{ github.sha }}
          oc rollout status deployment/online-calc
